# territori.yaml — letto dal pre-commit di Standards (ADR-004 di Standards).
#
# Dal 28 ottobre 2026 (ADR-007 di questo repo) non ci sono piu' territori ne'
# rami: su questo repo lavora un agente solo, e al posto del recinto c'e' un
# worktree per sessione. Il file resta perche' e' lui che dice al hook che il
# controllo vale qui, e con queste due chiavi il hook esegue le due regole che
# restano:
#   - il changelog additivo: sotto [Unreleased] si aggiunge, non si cancella,
#     salvo nel commit di rilascio, che ha VERSION in stage;
#   - numero e voce insieme: VERSION non entra senza CHANGELOG.md.
# Fino al 28 ottobre `main` rivendicava `motore` e `regole`, e `ui/*`
# l'`interfaccia`: il perche' e il prezzo sono nell'ADR-007.
changelog: CHANGELOG.md
version:   VERSION
