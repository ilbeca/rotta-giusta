# territori.yaml — chi tocca cosa, letto dal pre-commit di Standards (ADR-004).
# Linkato da AGENTS.md, sezione «Chi tocca cosa», che spiega il perche'.
#
# L'ordine conta: un file appartiene al PRIMO territorio che lo combacia, quindi
# le eccezioni dentro `site/` stanno prima del suo `**`. I `condivisi` vincono su
# tutto: `site/sw.js` resta di tutti anche se combacerebbe `site/**`.
territori:
  motore:      [site/engine.js, site/dati/**, site/figure/**, fonte/**, strumenti/**, tests/**, docs/adr/**, docs/motore.md, docs/specifica.md]
  regole:      [AGENTS.md, CLAUDE.md, territori.yaml, docs-check.yaml, .githooks/**, .claude/**, .agents/**, .gitignore, README.md, LICENSE, VERSION]
  interfaccia: [docs/*-ux.md, site/**]
condivisi:     [CHANGELOG.md, site/sw.js]
rami:
  "main":  [motore, regole]
  "ui/*":  [interfaccia]
