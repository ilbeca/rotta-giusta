<!doctype html>
<!--
  La pagina di riferimento del client degli account, regime progettato:
  docs/account-client-progetto.md §§4.1, 4.2, 5.2 e 9.2. Non e' pubblicata e
  non e' un prototipo: e' il minimo che soddisfa il banco del browser
  (tests/client_account.mjs) per C-01, C-02 e C-05, e serve a quel banco per
  provarsi al contrario a ogni esecuzione — questa pagina deve passare, e
  ognuna delle rotture elencate in ROTTURE_CLIENT di tests/test_interfaccia.py
  deve fallire nominando il difetto.

  Mostra anche la forma del contratto a chi realizza il client (P-18): gli
  agganci del runner di oggi, i testi del progetto, e indirizzoApi(), da cui il
  controllo riconosce il regime. Il disegno, gli altri stati e il resto dei
  flussi sono del progetto, non di qui. Il contratto per esteso sta nel §12.

  Senza account questa pagina non scrive niente: ne' IndexedDB, ne'
  localStorage, ne' sessionStorage, ne' cookie. Tutto sta in S, in memoria.
-->
<html lang="it">
<meta charset="utf-8">
<title>Client degli account, regime progettato: pagina di riferimento</title>
<style>[hidden]{display:none!important} #quizrun:not(.on), #rivedi:not(.on), #r-fine:not(.on) {display:none}</style>
<body>
<section id="v-oggi">
  <h1>Il tuo percorso</h1>
  <p id="avviso-prova">Senza account le risposte valgono solo finché questa pagina resta aperta. Se la chiudi o la ricarichi, le perdi. Non salviamo niente, nemmeno le tue preferenze.</p>
  <button data-rotta-start disabled>Inizia l'attività</button>
  <label>Data d'esame (facoltativa) <input type="date" id="esame-data"></label>
  <section id="rotta-last" hidden><h2>Ultima attività nei quiz</h2><p id="rotta-last-txt"></p></section>
</section>

<div id="quizrun">
  <button id="r-close">Termina l'attività</button>
  <div id="r-text"></div>
  <div id="r-verdict"></div>
  <div id="r-ans"></div>
  <div id="r-fine"></div>
</div>

<div id="rivedi"><button id="rv-close">Chiudi</button><div id="rv-body"></div></div>

<section id="account" role="dialog" aria-modal="true" hidden></section>

<script type="module">
import * as E from '/engine.js';

/** Dove sta l'API (account-progetto §7.4): la ricava la pagina dal proprio
 *  indirizzo, e altrove non c'e'. Dichiararla e' cio' da cui il controllo
 *  riconosce il regime progettato. */
function indirizzoApi(loc) {
  if (loc.hostname === 'rottagiusta.it') return 'https://api.rottagiusta.it';
  if (loc.hostname === 'localhost' || loc.hostname === '127.0.0.1') return `http://${loc.hostname}:8620`;
  return null;
}

// Tutto in memoria: senza account la pagina non conserva niente (§9.2).
const S = { banca: [], righe: [], run: null, esame: '', auto: false, ultima: null };
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

fetch('/dati/quiz.json').then((r) => r.json()).then((b) => {
  S.banca = b.filter((q) => q.k === 'base');
  document.querySelector('[data-rotta-start]').disabled = false;
});

$('esame-data').addEventListener('change', (e) => { S.esame = e.target.value; });

function avvia() {
  S.run = { id: uid(), lista: E.estrai(S.banca, {}, E.isoLocale().slice(0, 10), 10, Date.now() % 997), i: 0, esiti: [], pronta: Date.now() + 200 };
  $('quizrun').classList.add('on');
  $('r-fine').classList.remove('on');
  mostra();
}

function mostra() {
  const it = S.run.lista[S.run.i];
  $('r-text').textContent = it.d;
  $('r-verdict').textContent = '';
  $('r-ans').innerHTML = it.r.map((t, j) => `<button class="ans" data-i="${j}">${esc(t)}</button>`).join('');
}

function rispondi(j) {
  const R = S.run, it = R.lista[R.i];
  if (Date.now() < R.pronta || R.esiti.length > R.i) return;
  const giusta = j === it.x;
  R.esiti.push(giusta);
  S.righe.push({ _t: 'q', uid: uid(), item_id: it.id, ts: E.isoLocale(), ms: 5000, mode: 'mirata', kind: 'base', sim_uid: R.id, correct: giusta ? 1 : 0 });
  [...$('r-ans').children].forEach((b, k) => { if (k === it.x) b.classList.add('ok'); else if (k === j) b.classList.add('ko'); });
  $('r-verdict').textContent = giusta ? 'Risposta esatta.' : 'Risposta errata.';
}

function termina() {
  const R = S.run;
  if (!R.esiti.length) { $('quizrun').classList.remove('on'); S.run = null; return; }
  S.ultima = { id: R.id, lista: R.lista.slice(0, R.esiti.length), esiti: R.esiti.slice() };
  $('rotta-last').hidden = false;
  $('rotta-last-txt').textContent = `Risposte: ${R.esiti.length}`;
  riepilogo();
}

function riepilogo() {
  const u = S.ultima, esatte = u.esiti.filter(Boolean).length;
  $('r-fine').innerHTML = `<h1 tabindex="-1">Ti sei fermato qui</h1>
    <p>Hai risposto a ${u.esiti.length} su 10. Risposte corrette: ${esatte}. Risposte errate: ${u.esiti.length - esatte}.</p>
    <button data-ciclo="risposte">Rivedi le risposte</button>
    <section class="invito">
      <h2>Vuoi conservare le attività di questa pagina?</h2>
      <p>Senza account, chiudendo o ricaricando la pagina perdi le risposte e le preferenze. Crea un account per salvare le risposte, ritrovarle su un altro dispositivo e vedere i Progressi quando ci sono abbastanza dati.</p>
      <p>Le risposte saranno legate alla tua email e conservate sul nostro server, in chiaro. Il titolare può leggerle per supporto e statistiche.</p>
      <button data-account="registra">Crea un account e salva</button>
      <button data-account="continua">Continua senza account</button>
      <a href="/privacy">Come trattiamo i dati</a>
    </section>`;
  $('r-fine').classList.add('on');
}

function rivedi() {
  const u = S.ultima;
  $('rv-body').innerHTML = `<h1>Rivedi le risposte</h1>` + u.lista.map((it, k) =>
    `<p>${esc(it.d)} — ${u.esiti[k] ? 'esatta' : 'errata'}; risposta ufficiale: ${esc(it.r[it.x])}</p>`).join('');
  $('rivedi').classList.add('on');
}

// --- account: registrazione ed email gia' registrata (§4.2, §5.2) ---------------

function pannello(html) { const a = $('account'); a.innerHTML = html; a.hidden = false; }
function chiudiPannello() { $('account').hidden = true; $('account').innerHTML = ''; }

function moduloRegistrazione(email = '') {
  pannello(`<h2>Crea un account</h2><p>Salva le risposte di questa pagina e ritrovale quando torni.</p>
    <label>Email <input type="email" name="email" autocomplete="username" value="${esc(email)}"></label>
    <label>Password <input type="password" name="password" autocomplete="new-password"></label>
    <p>Almeno 15 caratteri, al massimo 256. Puoi usare una frase di tre o quattro parole.</p>
    <p id="account-esito" role="status"></p>
    <button data-account="crea">Crea l'account e salva</button>
    <button data-account="torna">Torna al riepilogo</button>`);
}

function moduloAccesso(email) {
  pannello(`<h2>Accedi</h2>
    <label>Email <input type="email" name="email" autocomplete="username" value="${esc(email)}"></label>
    <label>Password <input type="password" name="password" autocomplete="current-password"></label>
    <button data-account="entra">Accedi</button>
    <button data-account="torna">Torna all'attività</button>`);
}

async function registra() {
  const api = indirizzoApi(location);
  const email = $('account').querySelector('[name=email]').value;
  const password = $('account').querySelector('[name=password]').value;
  const esito = $('account-esito');
  const bottone = $('account').querySelector('[data-account=crea]');
  bottone.disabled = true;
  esito.textContent = 'Creazione dell\'account in corso…';
  let r, corpo = null;
  try {
    r = await fetch(`${api}/v1/registrazione`, { method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
    corpo = await r.json().catch(() => null);
  } catch {
    esito.textContent = 'Il server non ha risposto. Le risposte sono ancora qui: riprova.';
    bottone.disabled = false;
    return;
  }
  bottone.disabled = false;
  // Il caso si riconosce dal codice e da `errore`, non dal testo (§5.2).
  if (r.status === 409 && corpo && corpo.errore === 'email_registrata') {
    return pannello(`<h2>Crea un account</h2>
      <p role="alert"><strong>Questa email è già registrata.</strong> Accedi per conservare le risposte di questa pagina, oppure reimposta la password se non la ricordi.</p>
      <button data-account="accedi" data-email="${esc(email)}">Accedi</button>
      <button data-account="reimposta" data-email="${esc(email)}">Reimposta la password</button>
      <button data-account="torna">Torna al riepilogo</button>`);
  }
  esito.textContent = (corpo && corpo.messaggio) || 'La registrazione non è riuscita. Le risposte sono ancora qui: riprova.';
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.matches('[data-rotta-start]')) return avvia();
  if (t.matches('#r-ans .ans')) return rispondi(Number(t.dataset.i));
  if (t.id === 'r-close') return termina();
  if (t.dataset.ciclo === 'risposte') return rivedi();
  if (t.id === 'rv-close') return $('rivedi').classList.remove('on');
  const a = t.dataset.account;
  if (a === 'registra') return moduloRegistrazione();
  if (a === 'continua') { $('quizrun').classList.remove('on'); return; }
  if (a === 'crea') return registra();
  if (a === 'accedi') return moduloAccesso(t.dataset.email);
  if (a === 'reimposta') return pannello(`<h2>Reimposta la password</h2><label>Email <input type="email" name="email" value="${esc(t.dataset.email)}"></label><button data-account="torna">Torna all'attività</button>`);
  if (a === 'torna') return chiudiPannello();
});
</script>
</body>
</html>
