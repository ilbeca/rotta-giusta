  raccordi di «Allena». Nel regime di oggi il banco li ignora; nel ridisegno li

  soddisfa il controllo di tests/test_interfaccia.py, e serve a quel controllo

<title>Progressi: pagina di riferimento del banco della mappa</title>
<div id="d-mappa"></div>
<script type="module">
import * as E from '/engine.js';

const S = { banca: [], prog: {}, meta: { pesi_esame: {} }, oggi: '', mappa: null, run: null };

/** Una riga del motore, con l'azione del suo pulsante: mai un pulsante da zero. */
function rigaProgressi(r) {
  const out = { ...r, azione: r.daRifare > 0 ? { azione: 'rifai', quanti: r.daRifare, selezione: r.rifai } : null };
  if (r.voci) out.voci = r.voci.map(rigaProgressi);
  return out;
}

/**
 * La mappa di Progressi: le righe e le selezioni, dal motore, senza rifarle.
 *
 * richiesta: { banca, progress, oggi, kind, pesi }
 *   banca     la banca caricata
 *   progress  lo specchio dell'account, ricalcolato con E.ripiega()
 *   oggi      il giorno, 'AAAA-MM-GG'
 *   kind      'base' | 'vela', il selettore della mappa
 *   pesi      meta.pesi_esame, o null quando i metadati non li hanno
 */
function mappaProgressi(richiesta) {
  const { banca, progress, oggi, kind, pesi } = richiesta;
  const q = E.quadro(banca, progress, oggi, kind, pesi);
  const d = kind === 'base' ? E.dovePesa(q) : { indicazione: null, assente: 'senza pesi' };
  // I cinque stati (ridisegno §8.1, P-80): una contaStati() per aggregato, con
  // il filtro della riga, e nessuna conversione dei cinque in tre in pagina.
  const conStati = (r) => ({ ...r, stati: E.contaStati(banca, progress, r.filtro), voci: r.voci ? r.voci.map(conStati) : undefined });
  const righe = q.righe.map(rigaProgressi).map(conStati);
  for (const r of righe) if (r.voci === undefined) delete r.voci;
  return {
    kind,
    righe,
    totale: { ...q.totale, stati: E.contaStati(banca, progress, { kind }) },
    indicazione: d.indicazione,
    assente: d.assente,
  };
}

/** «Allena»: i quesiti della riga, da coda() con il suo filtro e il tetto di venti. */
function anteprimaAllenaProgressi(riga, richiesta) {
  const { banca, progress, oggi } = richiesta;
  const lista = E.coda(banca, progress, oggi, { ...riga.filtro, n: 20 });
  return lista.length ? { stato: 'pronta', quanti: lista.length, lista } : { stato: 'vuota', quanti: 0, lista: [] };
}

/** Inizia su Allena: la lista dell'anteprima, se e' ancora quella, id e ordine. */
function avviaAllenaProgressi(preparazione, richiesta, avvia) {
  const adesso = anteprimaAllenaProgressi(preparazione.riga, richiesta).lista;
  const stessa = adesso.length === preparazione.lista.length && adesso.every((x, i) => x.id === preparazione.lista[i].id);
  if (!stessa) return { avviata: false, stato: 'cambiata' };
  avvia(preparazione.lista, 'argomento', { origine: 'progressi' });
  return { avviata: true, quanti: preparazione.lista.length };
}

/** Quanti quesiti apre un pulsante adesso: la sua lista, o niente se i dati sono cambiati. */
function anteprimaProgressi(azione, richiesta) {
  const { banca, progress, oggi } = richiesta;
  const lista = E.coda(banca, progress, oggi, azione.selezione);
  if (!azione.quanti || lista.length !== azione.quanti) return { stato: 'cambiata', quanti: null, lista: [] };
  return { stato: 'pronta', quanti: lista.length, lista };
}

/** Inizia: la lista dell'anteprima, o niente. */
function avviaProgressi(azione, richiesta, avvia) {
  const a = anteprimaProgressi(azione, richiesta);
  if (a.stato !== 'pronta') return { avviata: false, stato: a.stato };
  avvia(a.lista, azione.azione === 'mai visti' ? 'argomento' : 'sbagliate', { origine: 'diag' });
  return { avviata: true, quanti: a.quanti };
}

/* ---- il collegamento con la pagina: letto dal controllo, non eseguito ---- */

function richiestaProgressi(kind) {
  return { banca: S.banca, progress: S.prog, oggi: S.oggi, kind, pesi: S.meta.pesi_esame || null };
}

function dipingiMappa(kind) {
  S.mappa = { richiesta: richiestaProgressi(kind), vista: null };
  S.mappa.vista = mappaProgressi(S.mappa.richiesta);
}

function apri(coda, modo, opt = {}) {
  S.run = { coda, i: 0, modo, origine: opt.origine || null };
}

document.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-rifai]');
  if (b) {
    const azione = JSON.parse(b.dataset.rifai);
    avviaProgressi(azione, S.mappa.richiesta, (lista, modo, o) => apri(lista, modo, o));
  }
  const a = ev.target.closest('[data-allena]');
  if (a) {
    const riga = S.mappa.vista.righe[Number(a.dataset.allena)];
    S.allena = { riga, ...anteprimaAllenaProgressi(riga, S.mappa.richiesta) };
  }
  if (ev.target.closest('[data-avvia-allena]')) {
    avviaAllenaProgressi(S.allena, S.mappa.richiesta, (lista, modo, o) => apri(lista, modo, o));
  }
});
</script>
