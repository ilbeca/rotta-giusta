<svg class="illustrazione" viewBox="0 0 600 380" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Il mare di notte visto dalla plancia: un faro sulla costa, una nave con i fanali rosso, verde e bianco, e la traccia della rotta sullo schermo">
<defs>
<radialGradient id="reticolo-cielo" cx=".5" cy="1" r="1"><stop offset="0" stop-color="#123150"/><stop offset="1" stop-color="#050E18"/></radialGradient>
<radialGradient id="reticolo-fascio" cx="0" cy=".5" r="1"><stop offset="0" stop-color="#FFF6D6" stop-opacity=".55"/><stop offset="1" stop-color="#FFF6D6" stop-opacity="0"/></radialGradient>
</defs>
<rect width="600" height="380" fill="url(#reticolo-cielo)"/>
<g fill="#E8F1F6"><circle cx="60" cy="40" r="1.2"/><circle cx="140" cy="80" r="1"/><circle cx="220" cy="30" r="1.4"/><circle cx="300" cy="70" r="1"/><circle cx="380" cy="24" r="1.2"/><circle cx="470" cy="60" r="1"/><circle cx="540" cy="36" r="1.4"/><circle cx="100" cy="130" r="1"/><circle cx="260" cy="120" r="1"/></g>
<!-- costa e faro -->
<path d="M430 210c30-14 60-20 90-18 30 2 60 10 80 18v170H430Z" fill="#0A1A29"/>
<path d="M452 214V150h12v62Z" fill="#1E3A52"/><path d="M448 150h20l-4-12h-12Z" fill="#2A5574"/>
<path d="M458 142 120 70v150Z" fill="url(#reticolo-fascio)"/>
<circle cx="458" cy="142" r="5" fill="#FFF6D6"/>
<!-- mare -->
<rect y="214" width="600" height="166" fill="#081A2A"/>
<g stroke="#5CC8E8" stroke-opacity=".18" fill="none"><path d="M0 240h600M0 270h600M0 300h600M0 330h600M0 360h600"/></g>
<!-- nave con i fanali: verde a sinistra di chi guarda, è la dritta -->
<g transform="translate(250 226)"><path d="M-46 0h92l-12 14h-68Z" fill="#132A3D"/><path d="M-10 0v-16h20V0" fill="#132A3D"/>
<circle cx="0" cy="-26" r="4" fill="#F5F9FB"/><circle cx="-30" cy="-6" r="4" fill="#4ADE80"/><circle cx="30" cy="-6" r="4" fill="#F87171"/>
<g opacity=".5"><circle cx="0" cy="-26" r="10" fill="#F5F9FB" opacity=".25"/><circle cx="-30" cy="-6" r="10" fill="#4ADE80" opacity=".3"/><circle cx="30" cy="-6" r="10" fill="#F87171" opacity=".3"/></g></g>
<!-- la traccia sul plotter -->
<path d="M20 360 120 320 200 344 300 300 400 318" fill="none" stroke="#5CC8E8" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<g fill="#07131F" stroke="#5CC8E8" stroke-width="3"><circle cx="20" cy="360" r="6"/><circle cx="120" cy="320" r="6"/><circle cx="200" cy="344" r="6"/><circle cx="300" cy="300" r="6"/></g>
<!-- anelli del radar -->
<g fill="none" stroke="#5CC8E8" stroke-opacity=".25"><circle cx="60" cy="320" r="40"/><circle cx="60" cy="320" r="80"/></g>
</svg>
