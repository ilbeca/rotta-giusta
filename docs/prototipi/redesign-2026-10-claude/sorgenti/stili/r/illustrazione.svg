<svg class="illustrazione" viewBox="0 0 600 380" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Un tratto di costa disegnato come su una carta nautica, specchiato: la terra bianca a sinistra, il mare a destra: un faro che lampeggia, una boa cardinale, le linee di profondità e una rotta che arriva al porto">
<defs>
<pattern id="dis-reticolo" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/></pattern>
<radialGradient id="dis-alone"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#FFE7A8" stop-opacity=".95"/><stop offset="1" stop-color="#FFE7A8" stop-opacity="0"/></radialGradient>
<!-- La rotta si disegna: una maschera piena che scorre lungo il tratteggio -->
<mask id="dis-maschera" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="380"><path class="rotta-maschera" pathLength="1" d="M30 352 150 270 236 156 330 236 372 324" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/></mask>
</defs>
<g transform="matrix(-1 0 0 1 600 0)">
<!-- Il mare aperto della Regata, e il basso fondale più chiaro sotto costa -->
<rect width="600" height="380" fill="#0A4F6E"/>
<path d="M0 0h600v380H0z" fill="url(#dis-reticolo)"/>
<path d="M360 0h240v380H300c-20-40 10-70 40-96 30-26 4-60-12-90-18-34 2-70 18-104C356 62 352 30 360 0Z" fill="#2F7896"/>
<g fill="none" stroke="#FFFFFF" stroke-opacity=".4" stroke-dasharray="2 5"><path d="M330 0c-14 34-26 72-8 108 18 36 34 70 2 100-30 28-66 54-48 92 8 18 14 50 6 80"/><path d="M290 0c-14 40-34 82-12 120 20 36 30 66-6 96-34 28-70 46-56 84 6 18 8 50 0 80"/></g>
<!-- La terra: bianca come una vela -->
<path d="M420 0h180v380H362c-14-30 2-52 26-72 30-24 20-58 6-84-16-30-4-60 12-88 16-28 8-62 14-136Z" fill="#FFFFFF"/>
<path d="M362 380c-14-30 2-52 26-72 30-24 20-58 6-84-16-30-4-60 12-88 16-28 8-62 14-136" fill="none" stroke="#0B2530" stroke-width="1.5"/>

<g font-family="Manrope,sans-serif" font-size="13" font-style="italic" fill="#FFFFFF" fill-opacity=".75"><text x="70" y="60" text-anchor="end" transform="matrix(-1 0 0 1 140 0)">42</text><text x="160" y="110" text-anchor="end" transform="matrix(-1 0 0 1 320 0)">37<tspan font-size="9" dy="3">5</tspan></text><text x="60" y="200" text-anchor="end" transform="matrix(-1 0 0 1 120 0)">51</text><text x="210" y="250" text-anchor="end" transform="matrix(-1 0 0 1 420 0)">28</text><text x="120" y="320" text-anchor="end" transform="matrix(-1 0 0 1 240 0)">46</text><text x="250" y="60" text-anchor="end" transform="matrix(-1 0 0 1 500 0)">23</text><text x="280" y="180" text-anchor="end" transform="matrix(-1 0 0 1 560 0)">14</text><text x="240" y="340" text-anchor="end" transform="matrix(-1 0 0 1 480 0)">19</text></g>
<!-- Il faro: il settore, nell'arancio delle boe di regata, e il lampo vero, Lam.(2) 10s -->
<path d="M392 150 300 96a110 110 0 0 0-12 108Z" fill="#FFE1BF" fill-opacity=".3"/>
<path d="M392 150c-22-10-40-14-50-10 8 6 26 10 50 10Z" fill="#FF6A1A"/>
<circle class="lampo lampo-faro" cx="392" cy="150" r="30" fill="url(#dis-alone)"/>
<circle cx="392" cy="150" r="6" fill="#0B2530"/><circle cx="392" cy="150" r="2.5" fill="#FFFFFF"/>
<text x="380" y="138" font-family="Manrope,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="start" transform="matrix(-1 0 0 1 760 0)">Lam.(2) 10s</text>
<!-- La boa cardinale est: nero giallo nero, coni base contro base, Sc.(3) 10s. Il bordo bianco la stacca dal mare scuro -->
<g transform="translate(250 280)">
<circle class="lampo lampo-boa" cx="0" cy="-30" r="22" fill="url(#dis-alone)"/>
<path d="M-6-36 0-44 6-36Z M-6-34 0-26 6-34Z" fill="#0B2530" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round" paint-order="stroke"/>
<path d="M0-26v6" stroke="#FFFFFF" stroke-width="4"/><path d="M0-26v6" stroke="#0B2530" stroke-width="2"/>
<path d="M-9 8h18l-3-28h-12Z" fill="#F2C200" stroke="#FFFFFF" stroke-width="3"/>
<path d="M-9 8h18l-3-28h-12Z" fill="none" stroke="#0B2530" stroke-width="1.2"/>
<path d="M-9.7 8h19.4l-.9-8h-17.6Z M-8 -12h16l-1-8h-14Z" fill="#0B2530"/>
<text x="16" y="2" font-family="Manrope,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="end" transform="matrix(-1 0 0 1 32 0)">Sc.(3) 10s</text>
</g>
<!-- La rotta, nell'arancio delle boe -->
<g mask="url(#dis-maschera)">
<path d="M30 352 150 270 236 156 330 236 372 324" fill="none" stroke="#FF6A1A" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<g fill="#FFFFFF" stroke="#FF6A1A" stroke-width="3"><circle cx="30" cy="352" r="7"/><circle cx="150" cy="270" r="7"/><circle cx="236" cy="156" r="7"/><circle cx="330" cy="236" r="7"/></g>
<path d="m362 310 14 20 4-24" fill="none" stroke="#FF6A1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- La rosa dei venti: ferma, il nord di una carta non si muove -->
<g transform="translate(96 108)"><g stroke="#FFFFFF" fill="none"><circle r="34" stroke-opacity=".55"/><circle r="26" stroke-opacity=".3"/><path d="M0-42V42M-42 0H42" stroke-opacity=".55"/><path d="M0-34 6 0 0 34-6 0Z" fill="#FFFFFF" fill-opacity=".9" stroke="none"/><text y="-46" font-family="Manrope,sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" stroke="none" text-anchor="middle" transform="matrix(-1 0 0 1 0 0)">N</text></g></g>
</g>
</svg>
