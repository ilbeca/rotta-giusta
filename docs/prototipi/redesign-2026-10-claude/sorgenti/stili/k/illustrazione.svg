<svg class="illustrazione" viewBox="0 0 600 380" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Un manifesto stampato a due colori, blu e arancio: il sole sul mare, un faro a strisce sulla scogliera che lampeggia, una boa cardinale e la rotta che arriva sotto costa">
<defs>
<pattern id="dis-retino" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.7" fill="#FF6A4D"/></pattern>
<pattern id="dis-retino-blu" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#2340A2"/></pattern>
<radialGradient id="dis-alone"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#FFC2B4"/><stop offset="1" stop-color="#FF6A4D" stop-opacity="0"/></radialGradient>
<mask id="dis-maschera" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="380"><path class="rotta-maschera" pathLength="1" d="M30 366 130 336 214 344 300 318 356 330" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/></mask>
</defs>
<rect width="600" height="380" fill="#FAFAF7"/>
<!-- Il cielo: una velatura di retino arancio sopra l'orizzonte -->
<rect y="150" width="600" height="56" fill="url(#dis-retino)" opacity=".55"/>
<!-- Il sole: arancio pieno e una corona di retino -->
<circle cx="150" cy="128" r="84" fill="url(#dis-retino)"/>
<circle cx="150" cy="128" r="62" fill="#FF6A4D"/>
<!-- Il mare: il blu pieno, con le onde in carta -->
<rect y="204" width="600" height="176" fill="#2340A2"/>
<g fill="none" stroke="#FAFAF7" stroke-width="2.5" stroke-linecap="round" stroke-opacity=".55"><path d="M20 232c20-6 40 6 60 0s40-6 60 0M200 246c20-6 40 6 60 0M60 276c20-6 40 6 60 0s40-6 60 0M180 306c20-6 40 6 60 0M20 340c20-6 40 6 60 0"/></g>
<!-- Il riflesso del sole: il secondo inchiostro sopra il primo -->
<g fill="#FF6A4D"><rect x="104" y="214" width="92" height="7" rx="3.5"/><rect x="118" y="230" width="64" height="6" rx="3"/><rect x="130" y="245" width="40" height="5" rx="2.5"/></g>
<!-- La scogliera e il faro a strisce -->
<path d="M600 380H330c10-40 26-70 52-96 18-18 28-40 40-70 10-24 34-32 70-30 40 2 80-6 108-30Z" fill="#1B2E73"/>
<path d="M600 380H330c10-40 26-70 52-96 18-18 28-40 40-70" fill="none" stroke="url(#dis-retino)" stroke-width="10" opacity=".7"/>
<path d="M392 214c-10-3-16-2-20 0l8-78h24l8 78c-4-2-10-3-20 0Z" fill="#FAFAF7"/>
<path d="M381 160h22l1.6 16h-25.2ZM379 190h26l1.5 14h-29Z" fill="#2340A2"/>
<rect x="378" y="126" width="28" height="12" fill="#2340A2"/>
<rect x="383" y="114" width="18" height="12" fill="#FAFAF7" stroke="#2340A2" stroke-width="2"/>
<path d="M380 114l12-12 12 12Z" fill="#2340A2"/>
<!-- Il settore della luce, stampato in arancio -->
<path d="M392 120 250 70a150 150 0 0 0 0 110Z" fill="#FF6A4D" fill-opacity=".28" style="mix-blend-mode:multiply"/>
<circle class="lampo lampo-faro" cx="392" cy="120" r="30" fill="url(#dis-alone)"/>
<circle cx="392" cy="120" r="4" fill="#FF6A4D"/>
<text x="414" y="98" font-family="Manrope,sans-serif" font-size="13" font-weight="800" fill="#1B2E73">Lam.(2) 10s</text>
<!-- La boa cardinale est, nei suoi colori veri: nero giallo nero, coni base contro base -->
<g transform="translate(250 300)">
<circle class="lampo lampo-boa" cx="0" cy="-30" r="22" fill="url(#dis-alone)"/>
<path d="M-6-36 0-44 6-36Z M-6-34 0-26 6-34Z" fill="#111" stroke="#FAFAF7" stroke-width="1" stroke-linejoin="round" paint-order="stroke"/>
<path d="M0-26v6" stroke="#FAFAF7" stroke-width="4"/><path d="M0-26v6" stroke="#111" stroke-width="2"/>
<path d="M-9 8h18l-3-28h-12Z" fill="#F2C200" stroke="#FAFAF7" stroke-width="3"/>
<path d="M-9.7 8h19.4l-.9-8h-17.6Z M-8 -12h16l-1-8h-14Z" fill="#111"/>
<text x="16" y="2" font-family="Manrope,sans-serif" font-size="12" font-weight="800" fill="#FAFAF7">Sc.(3) 10s</text>
</g>
<!-- La rotta, in arancio sopra il blu -->
<g mask="url(#dis-maschera)">
<path d="M30 366 130 336 214 344 300 318 356 330" fill="none" stroke="#FF6A4D" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<g fill="#2340A2" stroke="#FF6A4D" stroke-width="3"><circle cx="30" cy="366" r="6"/><circle cx="130" cy="336" r="6"/><circle cx="214" cy="344" r="6"/><circle cx="300" cy="318" r="6"/></g>
</g>
</svg>
