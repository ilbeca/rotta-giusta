<svg class="illustrazione" viewBox="0 0 600 380" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Un tratto di costa disegnato come su una carta nautica: un faro con i settori rosso, bianco e verde, una boa cardinale est, le linee di profondità e una rotta che passa a est della boa ed entra nel settore bianco">
<defs>
<pattern id="dis-reticolo" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/></pattern>
<radialGradient id="dis-alone"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#FFE7A8" stop-opacity=".95"/><stop offset="1" stop-color="#FFE7A8" stop-opacity="0"/></radialGradient>
<mask id="dis-maschera" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="380"><path class="rotta-maschera" pathLength="1" d="M236 374 300 300 279 191 352 164" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/></mask>
</defs>
<!-- T, terra bianca: il mare aperto della Regata, e il basso fondale più chiaro sotto costa -->
<rect width="600" height="380" fill="#0A4F6E"/>
<path d="M0 0h600v380H0z" fill="url(#dis-reticolo)"/>
<path d="M360 0h240v380H300c-20-40 10-70 40-96 30-26 4-60-12-90-18-34 2-70 18-104C356 62 352 30 360 0Z" fill="#2F7896"/>
<g fill="none" stroke="#FFFFFF" stroke-opacity=".4" stroke-dasharray="2 5"><path d="M330 0c-14 34-26 72-8 108 18 36 34 70 2 100-30 28-66 54-48 92 8 18 14 50 6 80"/><path d="M290 0c-14 40-34 82-12 120 20 36 30 66-6 96-34 28-70 46-56 84 6 18 8 50 0 80"/></g>
<!-- I settori del faro: verde, bianco e rosso, con i loro limiti tratteggiati. Si disegnano prima della terra, che li taglia sulla costa -->
<path d="M392 150L328.6 285.9A150 150 0 0 1 269.1 236.0Z" fill="#3DBE78" fill-opacity="0.1"/>
<path d="M392 150L269.1 236.0A150 150 0 0 1 242.6 163.1Z" fill="#FFFFFF" fill-opacity="0.07"/>
<path d="M392 150L242.6 163.1A150 150 0 0 1 262.1 75.0Z" fill="#FF5A55" fill-opacity="0.1"/>
<path d="M392 150L328.6 285.9" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="1" stroke-dasharray="3 4"/>
<path d="M392 150L269.1 236.0" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="1" stroke-dasharray="3 4"/>
<path d="M392 150L242.6 163.1" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="1" stroke-dasharray="3 4"/>
<path d="M392 150L262.1 75.0" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="1" stroke-dasharray="3 4"/>
<path d="M366.6 202.1A58 58 0 0 1 345.1 184.1" fill="none" stroke="#3DBE78" stroke-width="6" stroke-linecap="butt"/>
<text x="345.7" y="209.2" text-anchor="middle" font-family="Manrope,sans-serif" font-size="10" font-weight="800" fill="#3DBE78">V</text>
<path d="M343.9 182.4A58 58 0 0 1 334.3 156.1" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="butt"/>
<text x="320.9" y="165.3" text-anchor="middle" font-family="Manrope,sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">B</text>
<path d="M334.1 154.0A58 58 0 0 1 341.3 121.9" fill="none" stroke="#FF5A55" stroke-width="6" stroke-linecap="butt"/>
<text x="321.7" y="138.4" text-anchor="middle" font-family="Manrope,sans-serif" font-size="10" font-weight="800" fill="#FF5A55">R</text>
<!-- La terra -->
<path d="M420 0h180v380H362c-14-30 2-52 26-72 30-24 20-58 6-84-16-30-4-60 12-88 16-28 8-62 14-136Z" fill="#FFFFFF" stroke="#0B2530" stroke-width="1.5"/>
<path d="M470 40c30 20 60 10 90 40M480 140c30 10 70 0 100 24M450 260c40 4 80-10 130 10" fill="none" stroke="#6E9AAB" stroke-opacity=".7"/>
<g font-family="Manrope,sans-serif" font-size="13" font-style="italic" fill="#FFFFFF" fill-opacity=".75"><text x="70" y="60">42</text><text x="160" y="110">37<tspan font-size="9" dy="3">5</tspan></text><text x="60" y="200">51</text><text x="210" y="250">28</text><text x="120" y="320">46</text><text x="250" y="60">23</text><text x="214" y="190">14</text><text x="210" y="340">19</text></g>
<!-- Il faro, e il lampo vero, Lam.(2) 10s -->
<circle class="lampo lampo-faro" cx="392" cy="150" r="30" fill="url(#dis-alone)"/>
<circle cx="392" cy="150" r="6" fill="#0B2530"/><circle cx="392" cy="150" r="2.5" fill="#FFFFFF"/>
<text x="384" y="106" text-anchor="end" font-family="Manrope,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Lam.(2) BRV 10s</text>
<!-- La boa cardinale est: nero giallo nero, coni base contro base, Sc.(3) 10s. Si passa a est -->
<g transform="translate(262 252)">
<circle class="lampo lampo-boa" cx="0" cy="-30" r="22" fill="url(#dis-alone)"/>
<path d="M-6-36 0-44 6-36Z M-6-34 0-26 6-34Z" fill="#0B2530" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round" paint-order="stroke"/>
<path d="M0-26v6" stroke="#FFFFFF" stroke-width="4"/><path d="M0-26v6" stroke="#0B2530" stroke-width="2"/>
<path d="M-9 8h18l-3-28h-12Z" fill="#F2C200" stroke="#FFFFFF" stroke-width="3"/>
<path d="M-9 8h18l-3-28h-12Z" fill="none" stroke="#0B2530" stroke-width="1.2"/>
<path d="M-9.7 8h19.4l-.9-8h-17.6Z M-8 -12h16l-1-8h-14Z" fill="#0B2530"/>
<text x="4" y="28" text-anchor="end" font-family="Manrope,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Sc.(3) 10s</text>
</g>
<!-- La rotta, nell'arancio delle boe: passa a est della boa ed entra nel settore bianco -->
<g mask="url(#dis-maschera)">
<path d="M236 374 300 300 279 191 352 164" fill="none" stroke="#FF6A1A" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round" stroke-linejoin="round"/>
<g fill="#FFFFFF" stroke="#FF6A1A" stroke-width="3"><circle cx="236" cy="374" r="7"/><circle cx="300" cy="300" r="7"/><circle cx="279" cy="191" r="7"/></g>
<path d="m339 158 14 6-11 10" fill="none" stroke="#FF6A1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
