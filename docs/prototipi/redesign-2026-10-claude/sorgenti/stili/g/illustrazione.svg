<svg class="illustrazione" viewBox="0 0 600 380" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Le andature rispetto al vento che soffia da nord: quattro barche viste dall'alto, di bolina, al traverso, al lasco e in poppa">
<defs><pattern id="dis-onde" width="44" height="16" patternUnits="userSpaceOnUse"><path d="M0 10q5.5-5 11 0t11 0 11 0 11 0" fill="none" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="1.5"/></pattern>
<marker id="dis-punta" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FFFFFF"/></marker></defs>
<rect width="600" height="380" fill="#0A4F6E"/>
<rect width="600" height="380" fill="url(#dis-onde)"/>
<g font-family="Manrope,sans-serif">
<!-- Il vento, da nord, uguale su tutto il campo -->
<path d="M130 22V70" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="2.5" marker-end="url(#dis-punta)"/><path d="M255 22V70" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="2.5" marker-end="url(#dis-punta)"/><path d="M380 22V70" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="2.5" marker-end="url(#dis-punta)"/><path d="M505 22V70" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="2.5" marker-end="url(#dis-punta)"/>
<text x="30" y="40" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing=".08em">VENTO</text>
<!-- La rotta di regata, tratteggiata, verso la boa arancio -->
<path d="M40 330C160 300 380 316 548 300" fill="none" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="2" stroke-dasharray="8 7"/>
<g transform="translate(560 298)"><path d="M-12 11h24L0-17Z" fill="#FF6A1A" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/></g>
<g class="barca" style="--i:0"><g transform="translate(130 188) rotate(45) scale(1.85)">
<path d="M0-24C9-11 10 6 7 20H-7C-10 6-9-11 0-24Z" fill="#FFFFFF" stroke="#0B2530" stroke-width="1.2"/>
<path d="M0-5Q7.6 2.1 3.5 11.6Z" fill="#DCEAF0" stroke="#0B2530" stroke-width="1.2" stroke-linejoin="round"/>
<circle cy="-5" r="2" fill="#0B2530"/></g>
<text x="130" y="262" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">bolina</text></g><g class="barca" style="--i:1"><g transform="translate(255 188) rotate(90) scale(1.85)">
<path d="M0-24C9-11 10 6 7 20H-7C-10 6-9-11 0-24Z" fill="#FFFFFF" stroke="#0B2530" stroke-width="1.2"/>
<path d="M0-5Q10.3 -3.2 12.0 7.0Z" fill="#DCEAF0" stroke="#0B2530" stroke-width="1.2" stroke-linejoin="round"/>
<circle cy="-5" r="2" fill="#0B2530"/></g>
<text x="255" y="262" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">traverso</text></g><g class="barca" style="--i:2"><g transform="translate(380 188) rotate(135) scale(1.85)">
<path d="M0-24C9-11 10 6 7 20H-7C-10 6-9-11 0-24Z" fill="#FFFFFF" stroke="#0B2530" stroke-width="1.2"/>
<path d="M0-5Q10.2 -6.8 15.4 2.2Z" fill="#DCEAF0" stroke="#0B2530" stroke-width="1.2" stroke-linejoin="round"/>
<circle cy="-5" r="2" fill="#0B2530"/></g>
<text x="380" y="262" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">lasco</text></g><g class="barca" style="--i:3"><g transform="translate(505 188) rotate(180) scale(1.85)">
<path d="M0-24C9-11 10 6 7 20H-7C-10 6-9-11 0-24Z" fill="#FFFFFF" stroke="#0B2530" stroke-width="1.2"/>
<path d="M0-5Q9.0 -10.2 16.9 -3.5Z" fill="#DCEAF0" stroke="#0B2530" stroke-width="1.2" stroke-linejoin="round"/>
<circle cy="-5" r="2" fill="#0B2530"/></g>
<text x="505" y="262" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">poppa</text></g>
</g>
</svg>
