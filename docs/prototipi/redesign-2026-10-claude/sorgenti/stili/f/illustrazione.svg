<svg class="illustrazione" viewBox="0 0 600 380" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Un manuale aperto al sommario: otto capitoli, uno per tema d'esame, ognuno con la sua linguetta colorata sul bordo, lunga quanto le domande che porta nella prova">
<rect width="600" height="380" fill="#E6EAEF"/>
<!-- Il manuale aperto: a sinistra una pagina con un disegno, a destra il sommario -->
<path d="M30 20h222v344H38a8 8 0 0 1-8-8Z" fill="#FFFFFF"/>
<path d="M256 20h214v344H256Z" fill="#FFFFFF"/>
<rect x="244" y="20" width="24" height="344" fill="url(#dis-dorso)"/>
<defs><linearGradient id="dis-dorso"><stop offset="0" stop-color="#1B1D21" stop-opacity="0"/><stop offset=".5" stop-color="#1B1D21" stop-opacity=".14"/><stop offset="1" stop-color="#1B1D21" stop-opacity="0"/></linearGradient></defs>
<g font-family="Manrope,sans-serif">
<text x="56" y="62" font-size="11" font-weight="800" fill="#2E3FA8">CAPITOLO 1</text>
<text x="56" y="84" font-size="17" font-weight="800" fill="#1B1D21">Navigazione</text>
<g fill="#1B1D21" fill-opacity=".14"><rect x="56" y="100" width="168" height="5" rx="2.5"/><rect x="56" y="113" width="150" height="5" rx="2.5"/><rect x="56" y="126" width="160" height="5" rx="2.5"/></g>
<!-- Un esercizio di carteggio a margine: due rilevamenti che si incrociano -->
<g transform="translate(140 236)" fill="none" stroke="#2E3FA8" stroke-width="2"><circle r="52" stroke-opacity=".25"/><path d="M-70 40 60-34M-56-46 56 44" stroke-dasharray="6 5"/><circle r="5" fill="#2E3FA8"/><path d="M0-60V60M-60 0H60" stroke="#1B1D21" stroke-opacity=".2" stroke-width="1"/></g>
<text x="56" y="340" font-size="11" fill="#1B1D21" fill-opacity=".6">Punto nave con due rilevamenti</text>
<text x="272" y="49" font-size="12" font-weight="600" fill="#1B1D21">Navigazione cartografica</text><path d="M436.4 47H452" stroke="#1B1D21" stroke-opacity=".35" stroke-dasharray="1 4"/><text x="272" y="89" font-size="12" font-weight="600" fill="#1B1D21">Manovra e condotta</text><path d="M396.8 87H452" stroke="#1B1D21" stroke-opacity=".35" stroke-dasharray="1 4"/><text x="272" y="129" font-size="12" font-weight="600" fill="#1B1D21">Sicurezza della navigazione</text><path d="M456.2 127H452" stroke="#1B1D21" stroke-opacity=".35" stroke-dasharray="1 4"/><text x="272" y="169" font-size="12" font-weight="600" fill="#1B1D21">Normativa diportistica</text><path d="M423.2 167H452" stroke="#1B1D21" stroke-opacity=".35" stroke-dasharray="1 4"/><text x="272" y="209" font-size="12" font-weight="600" fill="#1B1D21">Colreg e segnalamento</text><path d="M416.6 207H452" stroke="#1B1D21" stroke-opacity=".35" stroke-dasharray="1 4"/><text x="272" y="249" font-size="12" font-weight="600" fill="#1B1D21">Meteorologia</text><path d="M357.2 247H452" stroke="#1B1D21" stroke-opacity=".35" stroke-dasharray="1 4"/><text x="272" y="289" font-size="12" font-weight="600" fill="#1B1D21">Teoria dello scafo</text><path d="M396.8 287H452" stroke="#1B1D21" stroke-opacity=".35" stroke-dasharray="1 4"/><text x="272" y="329" font-size="12" font-weight="600" fill="#1B1D21">Motori</text><path d="M317.6 327H452" stroke="#1B1D21" stroke-opacity=".35" stroke-dasharray="1 4"/>
