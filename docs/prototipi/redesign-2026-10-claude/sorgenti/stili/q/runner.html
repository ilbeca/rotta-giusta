<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>La domanda, dopo un errore · mock «@@NOME@@»</title>
<style>@@CSS@@
body{background:var(--carta)}
.r-testata{position:sticky;top:0;z-index:5;background:var(--carta);border-bottom:1px solid var(--filo-2)}
.r-in{max-width:760px;margin:0 auto;padding:var(--s-8) var(--s-16) var(--s-12)}
.r-riga{display:flex;align-items:center;gap:var(--s-12);min-height:44px}
.termina{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding-right:var(--s-8);font-weight:700;font-size:var(--t-14);text-decoration:none;color:var(--ink-2)}
.termina .ico{width:20px;height:20px}
.pos{margin-left:auto;font-weight:800;font-size:var(--t-14)}
.pos span{color:var(--ink-3);font-weight:600}
.tempo{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-14);font-weight:600;color:var(--ink-3)}
.tempo .ico{width:16px;height:16px}
/* La rotta come avanzamento: dieci tappe */
.rotta{position:relative;display:flex;justify-content:space-between;align-items:center;margin-top:var(--s-8);height:20px}
.rotta::before{content:"";position:absolute;left:8px;right:8px;top:50%;border-top:2px dashed var(--filo)}
.tappa{position:relative;z-index:1;width:14px;height:14px;border-radius:50%;background:var(--carta);border:2px solid var(--filo)}
.tappa.ko{border-color:var(--ko);background:var(--ko)}
.tappa.ok{border-color:var(--ok);background:var(--ok)}
/* La domanda corrente: un anello del colore dei comandi, sulla domanda che stai leggendo */
.tappa.ora{box-shadow:0 0 0 3px var(--carta),0 0 0 5px var(--ink)}
.r-main{max-width:760px;margin:0 auto;padding:var(--s-24) var(--s-16) 136px}
.meta{display:flex;flex-wrap:wrap;gap:4px var(--s-12);align-items:baseline}
.numero{font-weight:700;font-size:var(--t-14);color:var(--ink-2);letter-spacing:.02em}
.domanda{font-size:var(--t-20);font-weight:700;line-height:1.45;letter-spacing:-.01em;margin:var(--s-12) 0 var(--s-24)}
.risposte{display:grid;gap:var(--s-12);list-style:none;padding:0;margin:0}
.risposta{display:flex;gap:var(--s-12);align-items:flex-start;padding:var(--s-16);border-radius:var(--r);border:1.5px solid var(--filo);background:var(--campo);font-size:var(--t-16);line-height:1.45}
.tasto{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink-3);display:grid;place-items:center;font-weight:800;font-size:var(--t-14);flex:none}
.risposta .stato{display:block;font-size:var(--t-12);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.risposta.tua{border-color:var(--ko);background:var(--ko-chiaro)}
.risposta.tua .tasto{background:var(--ko);border-color:var(--ko);color:var(--su-esito,#fff)}
.risposta.tua .stato{color:var(--ko)}
.risposta.esatta{border-color:var(--ok);background:var(--ok-chiaro)}
.risposta.esatta .tasto{background:var(--ok);border-color:var(--ok);color:var(--su-esito,#fff)}
.risposta.esatta .stato{color:var(--ok)}
.risposta.spenta{color:var(--ink-3)}
.perche{margin-top:var(--s-24);padding-top:var(--s-16);border-top:1px solid var(--filo)}
.perche p{font-size:var(--t-14);color:var(--ink-2)}
.chips{display:flex;gap:var(--s-8);margin-top:var(--s-8);flex-wrap:wrap}
.chip{min-height:44px;padding:0 var(--s-16);border-radius:999px;border:1.5px solid var(--ink-3);background:transparent;font:600 var(--t-14) Manrope,sans-serif;color:var(--ink)}
.servizio{display:flex;gap:var(--s-24);margin-top:var(--s-16)}
.servizio a{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:var(--t-14);font-weight:600;color:var(--ink-2);text-decoration:none}
.servizio .ico{width:20px;height:20px}
.piede-runner{position:fixed;left:0;right:0;bottom:0;background:var(--carta);border-top:1px solid var(--filo);padding:var(--s-12) var(--s-16) calc(var(--s-12) + env(safe-area-inset-bottom))}
.piede-runner .in{max-width:760px;margin:0 auto}
.esito{display:flex;align-items:center;gap:var(--s-8);font-weight:800;color:var(--ko);font-size:var(--t-16);margin-bottom:var(--s-8)}
.esito .ico{width:22px;height:22px;stroke-width:2.5}
@media (min-width:900px){
  .domanda{font-size:var(--t-24)}
  .r-main{padding-top:var(--s-48)}
}
/* La carta che vive: la domanda si gioca davvero, e l'anello scivola di tappa in tappa */
.r-testata{view-transition-name:avvio}
.rotta .tappa.ora{box-shadow:none}
.anello{position:absolute;z-index:2;top:50%;left:calc((100% - 14px) * var(--i, 0) / 9 + 7px);width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:2.5px solid var(--ink);pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  .anello{transition:left .55s cubic-bezier(.16,1,.3,1)}
  .tappa{transition:background-color .3s,border-color .3s,transform .3s cubic-bezier(.16,1,.3,1)}
  .tappa.ok,.tappa.ko{transform:scale(1.08)}
  .domanda-blocco.entra{animation:domanda .45s cubic-bezier(.2,.8,.2,1)}
  .risposta{transition:background-color .2s,border-color .2s,transform .15s}
  .risposta:active{transform:scale(.985)}
  .piede-runner{transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .2s}
}
@keyframes domanda{from{opacity:0;transform:translateX(24px)}}
button.risposta{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
button.risposta:hover:not([disabled]){border-color:var(--ink-3)}
button.risposta[disabled]{cursor:default}
.piede-runner[hidden]{display:block;transform:translateY(110%);opacity:0;pointer-events:none}
.esito.giusta{color:var(--ok)}
.voce{font-size:var(--t-14);font-weight:600;color:var(--ink-3)}
.perche[hidden]{display:none}
.domanda:focus{outline:none}
.servizio{flex-wrap:wrap;gap:0 var(--s-24)}
.servizio a{white-space:nowrap}
@@TEMA@@
</style></head>
<body class="pagina-domanda">
@@ICONE@@
<div class="mare-fisso" aria-hidden="true">@@CARTA@@</div>
<header class="r-testata"><div class="r-in">
  <div class="r-riga">
    <a class="termina" href="riepilogo.html" id="termina"><svg class="ico"><use href="#i-chiudi"/></svg>Termina</a>
    <span class="tempo"><svg class="ico"><use href="#i-orologio"/></svg><span id="tempo">0:00</span></span>
    <span class="pos"><span id="n" style="color:inherit;font-weight:800">1</span> <span>di 10</span></span>
  </div>
  <div class="rotta" id="rotta" aria-hidden="true">
    <i class="tappa"></i><i class="tappa"></i><i class="tappa"></i><i class="tappa"></i><i class="tappa"></i><i class="tappa"></i><i class="tappa"></i><i class="tappa"></i><i class="tappa"></i><i class="tappa"></i><i class="anello"></i>
  </div>
</div></header>
<main class="r-main">
  <div class="domanda-blocco" id="blocco">
    <div class="meta"><span class="numero" id="numero"></span><span class="voce" id="voce"></span></div>
    <h1 class="domanda" id="domanda" tabindex="-1"></h1>
    <ol class="risposte" id="risposte"></ol>
  </div>
  <div class="perche" id="perche" hidden>
    <p>Se vuoi, segna perché hai sbagliato. Puoi saltarlo.</p>
    <div class="chips"><button class="chip" aria-pressed="false">Non lo sapevo</button><button class="chip" aria-pressed="false">Svista</button></div>
  </div>
  <div class="servizio">
    <a href="#segno"><svg class="ico"><use href="#i-segno"/></svg>Metti un segnalibro</a>
    <a href="#segnala"><svg class="ico"><use href="#i-bandiera"/></svg>Segnala un problema</a>
  </div>
</main>
<div class="piede-runner" id="piede" hidden><div class="in">
  <p class="esito" id="esito" role="status"></p>
  <button class="btn btn-pieno btn-largo" id="avanti" data-ruolo="principale">Avanti<svg class="ico"><use href="#i-freccia"/></svg></button>
</div></div>
<script>
// Un mock che si gioca: tre domande vere della banca, poi il riepilogo.
const DOMANDE = [
  { t: 1, n: '1.7.6-19', v: 'Navigazione costiera', d: "Di cosa ho bisogno per determinare, in corso di navigazione, la posizione dell'unità rispetto ad un punto cospicuo?",
    r: ['di due distanze del punto cospicuo.', 'di un rilevamento e di una distanza del punto cospicuo.', 'di due rilevamenti contemporanei del punto cospicuo.'], x: 1 },
  { t: 2, n: '1.4.3-24', v: 'Ancoraggio', d: "Se un'ancora non tiene, si dice che:", r: ['sta arando.', 'fa testa.', 'sta agguantando.'], x: 0 },
  { t: 5, n: '1.5.1-10', v: 'Fanali e segnali diurni', d: "Una nave all'ancora di giorno deve mostrare:", r: ['un pallone nero.', 'un cilindro a prora.', 'un cono a prora con il vertice in alto.'], x: 0 },
];
const $ = (id) => document.getElementById(id);
const tappe = [...document.querySelectorAll('#rotta .tappa')];
let i = 0, scelta = null, giuste = 0, sbagliate = 0;
const inizio = Date.now();
setInterval(() => { const s = Math.floor((Date.now() - inizio) / 1000); $('tempo').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }, 1000);
const esc = (t) => t.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const meta = () => `riepilogo.html?g=${giuste}&s=${sbagliate}`;

function mostra(animata) {
  const q = DOMANDE[i];
  $('n').textContent = i + 1;
  document.body.dataset.tema = q.t;
  $('rotta').style.setProperty('--i', i);
  $('numero').textContent = `N. ${q.n}`; $('voce').textContent = q.v; $('domanda').textContent = q.d;
  $('risposte').innerHTML = q.r.map((t, k) => `<li><button class="risposta" data-k="${k}"><span class="tasto">${k + 1}</span><span>${esc(t)}</span></button></li>`).join('');
  $('perche').hidden = true; $('piede').hidden = true; scelta = null;
  $('termina').href = meta();
  if (animata) { const b = $('blocco'); b.classList.remove('entra'); void b.offsetWidth; b.classList.add('entra'); $('domanda').focus({ preventScroll: true }); }
}
function rispondi(k) {
  if (scelta !== null) return;
  const q = DOMANDE[i]; scelta = k; const giusta = k === q.x;
  giusta ? giuste++ : sbagliate++;
  document.querySelectorAll('#risposte .risposta').forEach((b, j) => {
    b.disabled = true;
    if (j === q.x) { b.classList.add('esatta'); b.querySelector('span:last-child').insertAdjacentHTML('afterbegin', '<span class="stato">Risposta del decreto</span>'); }
    else if (j === k) { b.classList.add('tua'); b.querySelector('span:last-child').insertAdjacentHTML('afterbegin', '<span class="stato">La tua risposta</span>'); }
    else b.classList.add('spenta');
  });
  tappe[i].classList.add(giusta ? 'ok' : 'ko');
  $('esito').className = 'esito ' + (giusta ? 'giusta' : '');
  $('esito').innerHTML = giusta ? '<svg class="ico"><use href="#i-ok"/></svg>Giusta.' : `<svg class="ico"><use href="#i-ko"/></svg>Sbagliata. Era la ${q.x + 1}.`;
  $('perche').hidden = giusta; $('piede').hidden = false; $('termina').href = meta();
  $('avanti').textContent = ''; $('avanti').insertAdjacentHTML('afterbegin', (i === DOMANDE.length - 1 ? 'Vedi il riepilogo' : 'Avanti') + '<svg class="ico"><use href="#i-freccia"/></svg>');
}
function avanti() {
  if (scelta === null) return;
  if (i === DOMANDE.length - 1) { location.href = meta(); return; }
  i++; mostra(true);
}
$('risposte').addEventListener('click', (e) => { const b = e.target.closest('.risposta'); if (b) rispondi(+b.dataset.k); });
$('avanti').addEventListener('click', avanti);
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input,textarea')) return;
  if (['1', '2', '3'].includes(e.key)) rispondi(+e.key - 1);
  if (e.key === 'Enter' && scelta !== null && !e.target.closest('button,a')) avanti();
});
document.querySelectorAll('.chip').forEach((c) => c.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach((o) => o.setAttribute('aria-pressed', String(o === c && c.getAttribute('aria-pressed') !== 'true')));
}));
mostra(false);
// Per le schermate: #dopo apre la prima domanda già risposta, sbagliata
if (location.hash === '#dopo') rispondi(0);
</script>
</body></html>
