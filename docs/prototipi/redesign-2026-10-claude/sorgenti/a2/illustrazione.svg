<svg class="illustrazione" viewBox="0 0 600 380" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Un tratto di costa disegnato come su una carta nautica: un faro che lampeggia, una boa cardinale, le linee di profondità e una rotta che arriva al porto">
<defs>
<pattern id="reticolo" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#0B1F33" stroke-opacity=".08"/></pattern>
<radialGradient id="reticolo-alone"><stop offset="0" stop-color="#FFF7D1"/><stop offset=".35" stop-color="#FFE58A" stop-opacity=".9"/><stop offset="1" stop-color="#FFE58A" stop-opacity="0"/></radialGradient>
<!-- La rotta si disegna: una maschera piena che scorre lungo il tratteggio -->
<mask id="reticolo-maschera" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="380"><path class="rotta-maschera" pathLength="1" d="M30 352 150 270 236 156 330 236 372 324" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/></mask>
</defs>
<rect width="600" height="380" fill="#DDEEF4"/>
<path d="M0 0h600v380H0z" fill="url(#reticolo)"/>
<path d="M360 0h240v380H300c-20-40 10-70 40-96 30-26 4-60-12-90-18-34 2-70 18-104C356 62 352 30 360 0Z" fill="#B9DAE8"/>
<g fill="none" stroke="#0B1F33" stroke-opacity=".35" stroke-dasharray="2 5"><path d="M330 0c-14 34-26 72-8 108 18 36 34 70 2 100-30 28-66 54-48 92 8 18 14 50 6 80"/><path d="M290 0c-14 40-34 82-12 120 20 36 30 66-6 96-34 28-70 46-56 84 6 18 8 50 0 80"/></g>
<path d="M420 0h180v380H362c-14-30 2-52 26-72 30-24 20-58 6-84-16-30-4-60 12-88 16-28 8-62 14-136Z" fill="#EFE3C4" stroke="#0B1F33" stroke-width="1.5"/>
<path d="M470 40c30 20 60 10 90 40M480 140c30 10 70 0 100 24M450 260c40 4 80-10 130 10" fill="none" stroke="#B59A5B" stroke-opacity=".6"/>
<g font-family="Manrope,sans-serif" font-size="13" font-style="italic" fill="#0B1F33" fill-opacity=".7"><text x="70" y="60">42</text><text x="160" y="110">37<tspan font-size="9" dy="3">5</tspan></text><text x="60" y="200">51</text><text x="210" y="250">28</text><text x="120" y="320">46</text><text x="250" y="60">23</text><text x="280" y="180">14</text><text x="240" y="340">19</text></g>
<!-- Il faro: il settore magenta delle carte, e il lampo vero, Lam.(2) 10s -->
<path d="M392 150 300 96a110 110 0 0 0-12 108Z" fill="#B0176F" fill-opacity=".14"/>
<path d="M392 150c-22-10-40-14-50-10 8 6 26 10 50 10Z" fill="#B0176F"/>
<circle class="lampo lampo-faro" cx="392" cy="150" r="30" fill="url(#reticolo-alone)"/>
<circle cx="392" cy="150" r="6" fill="#0B1F33"/><circle cx="392" cy="150" r="2.5" fill="#FBF8F1"/>
<text x="404" y="146" font-family="Manrope,sans-serif" font-size="12" font-weight="700" fill="#0B1F33">Lam.(2) 10s</text>
<!-- La boa cardinale est: nero giallo nero, coni base contro base, Sc.(3) 10s -->
<g transform="translate(250 280)">
<circle class="lampo lampo-boa" cx="0" cy="-30" r="22" fill="url(#reticolo-alone)"/>
<path d="M-6-36 0-44 6-36Z M-6-34 0-26 6-34Z" fill="#0B1F33"/>
<path d="M0-26v6" stroke="#0B1F33" stroke-width="2"/>
<path d="M-9 8h18l-3-28h-12Z" fill="#E8B923" stroke="#0B1F33" stroke-width="1.5"/>
<path d="M-9.7 8h19.4l-.9-8h-17.6Z M-8 -12h16l-1-8h-14Z" fill="#0B1F33"/>
<text x="16" y="2" font-family="Manrope,sans-serif" font-size="12" font-weight="700" fill="#0B1F33">Sc.(3) 10s</text>
</g>
<!-- La rotta -->
<g mask="url(#reticolo-maschera)">
<path d="M30 352 150 270 236 156 330 236 372 324" fill="none" stroke="#B0176F" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
<g fill="#FBF8F1" stroke="#B0176F" stroke-width="3"><circle cx="30" cy="352" r="7"/><circle cx="150" cy="270" r="7"/><circle cx="236" cy="156" r="7"/><circle cx="330" cy="236" r="7"/></g>
<path d="m362 310 14 20 4-24" fill="none" stroke="#B0176F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- La rosa dei venti: ruota piano mentre si scorre -->
<g transform="translate(96 108)"><g class="rosa" stroke="#0B1F33" fill="none"><circle r="34" stroke-opacity=".5"/><circle r="26" stroke-opacity=".3"/><path d="M0-42V42M-42 0H42" stroke-opacity=".5"/><path d="M0-34 6 0 0 34-6 0Z" fill="#0B1F33" fill-opacity=".85" stroke="none"/><text y="-46" text-anchor="middle" font-family="Manrope,sans-serif" font-size="11" font-weight="800" fill="#0B1F33" stroke="none">N</text></g></g>
</svg>
